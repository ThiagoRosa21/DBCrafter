name: Quality and security
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: dbcrafter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-only
          MYSQL_DATABASE: dbcrafter_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_DSN: postgresql://postgres:test-only@127.0.0.1:5432/dbcrafter_test
      TEST_MYSQL_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: pip-audit --disable-pip --no-deps -r requirements.txt
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose config -q
      - run: docker compose up -d --build --wait
      - name: Check unprivileged process and conversion
        run: |
          test "$(docker compose exec -T dbcrafter id -u)" != "0"
          printf 'id,name\n001,Ana\n' > /tmp/sample.csv
          curl --fail --silent --show-error -F 'file-upload=@/tmp/sample.csv' -F 'table-name=clients' http://127.0.0.1:5000/process > /tmp/result.sql
          grep -F 'INSERT INTO "clients"' /tmp/result.sql
      - if: always()
        run: docker compose down
